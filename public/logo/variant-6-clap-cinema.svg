<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" width="340" height="88">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#625fff"/>
      <stop offset="1" stop-color="#9810fa"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a4b3ff"/>
      <stop offset="0.5" stop-color="#7d87ff"/>
      <stop offset="1" stop-color="#c07eff"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="8" y="16" width="56" height="12" rx="5"/>
    </clipPath>
  </defs>
  <!-- Corps du clap -->
  <rect x="8" y="30" width="56" height="38" rx="8" fill="url(#g)"/>
  <!-- Barre supérieure du clap -->
  <rect x="8" y="16" width="56" height="12" rx="5" fill="url(#g)"/>
  <!-- Rayures blanches, découpées proprement dans la barre et symétriques autour de x=36 -->
  <g clip-path="url(#barClip)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5">
    <path d="M11 28 L17 16"/>
    <path d="M23 28 L29 16"/>
    <path d="M43 28 L49 16"/>
    <path d="M55 28 L61 16"/>
  </g>
  <!-- Triangle play centré dans le corps (36, 49) -->
  <path d="M31 41 L45 49 L31 57 Z" fill="#ffffff"/>
  <text x="84" y="58" font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" font-size="42" letter-spacing="-1" fill="#ffffff">Seerr<tspan fill="url(#tg)">Play</tspan></text>
</svg>
