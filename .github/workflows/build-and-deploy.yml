name: Build and deploy SeerrPlay website

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: seerrplay-website-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oploy-fr/seerrplay-website:sha-${{ github.sha }}
            ghcr.io/oploy-fr/seerrplay-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin deployed image revision
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("deploy/kustomization.yaml")
          content = path.read_text()
          lines = content.splitlines()
          updated = []
          for line in lines:
              if line.strip().startswith("newTag:"):
                  updated.append(f"    newTag: {os.environ['IMAGE_TAG']}")
              else:
                  updated.append(line)
          path.write_text("\n".join(updated) + "\n")
          PY

      - name: Commit deployment revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy ${GITHUB_SHA::7}"
          git push
